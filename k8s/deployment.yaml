apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: marketly
  labels:
    app: search-api
    tier: api
  annotations:
    sentinel.io/repo: "marketly-org/search-api"
    sentinel.io/branch: "main"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: search-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search-api
        tier: api
    spec:
      containers:
        - name: app
          image: ghcr.io/marketly-org/search-api:sha-ce91d9f
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: RUST_LOG
              value: "info,search_api=debug"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
